[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-change-vision"
version = "0.1.0"
description = "Leakage-aware aerial change detection and small-object splits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "M S Rishav Subhin"}]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# ingest (scripts/build_oscd_manifest.py) and dev tooling
ingest = ["pyarrow>=14", "pillow>=10"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The default pytest temp root (%TEMP%/pytest-of-*) is permission-locked on
# this machine; keep test scratch inside the repo instead.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
